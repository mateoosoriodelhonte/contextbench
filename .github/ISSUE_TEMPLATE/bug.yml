name: Bug report
description: Report reproducible ContextBench behavior.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Do not attach private documents, model cache contents, credentials, or personal data.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the exact error, route or command, and visible result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use synthetic or public data and list the smallest steps that fail.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ContextBench version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, Node, embedding provider, and CPU or accelerator.
    validations:
      required: true
